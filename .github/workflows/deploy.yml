name: Build & Deploy to GCP VM # v7

on:
  push:
    branches:
      - claude/replicate-asis-v5-h5mWO
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Package dist
        run: tar -czf dist.tar.gz dist/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: SCP dist to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          scp -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            dist.tar.gz \
            "${VM_USER}@${VM_HOST}:/tmp/asis-dist.tar.gz"

      - name: Deploy on VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          ssh -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${VM_USER}@${VM_HOST}" << 'ENDSSH'
          set -e

          echo "=== Installing nginx (with apt-lock retry) ==="
          for i in 1 2 3 4 5; do
            sudo apt-get install -y nginx rsync && break
            echo "Attempt $i failed, waiting 15s for apt lock..."
            sleep 15
          done

          echo "=== Releasing port 3000 from any existing process ==="
          # Kill whatever currently occupies port 3000 (Node, PM2, old nginx config, etc.)
          PORT_PID=$(sudo lsof -t -i:3000 2>/dev/null || true)
          if [ -n "$PORT_PID" ]; then
            echo "Killing PID(s) on :3000 → $PORT_PID"
            sudo kill -9 $PORT_PID 2>/dev/null || true
            sleep 2
          fi
          # Also stop pm2 if it's managing the old app
          command -v pm2 &>/dev/null && pm2 stop all 2>/dev/null || true

          echo "=== Deploying static files ==="
          sudo mkdir -p /var/www/asis-v5
          sudo tar -xzf /tmp/asis-dist.tar.gz -C /tmp/
          sudo rsync -a --delete /tmp/dist/ /var/www/asis-v5/
          rm -f /tmp/asis-dist.tar.gz

          echo "=== Writing nginx config for port 3000 ==="
          sudo tee /etc/nginx/sites-available/asis-v5 > /dev/null << 'NGINX'
server {
    listen 3000;
    server_name _;
    root /var/www/asis-v5;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/x-javascript image/svg+xml font/woff2;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|woff2?|ttf|eot|png|ico|svg|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
NGINX

          sudo ln -sf /etc/nginx/sites-available/asis-v5 /etc/nginx/sites-enabled/asis-v5
          # Remove default site to avoid conflict
          sudo rm -f /etc/nginx/sites-enabled/default

          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl restart nginx

          echo "=== Verifying ==="
          sleep 2
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "HTTP status on :3000 → $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Expected 200, got $HTTP_CODE"
            sudo journalctl -u nginx --no-pager -n 20
            exit 1
          fi
          echo "=== Deploy complete — ASIS v5 live on port 3000 ==="
          ENDSSH
