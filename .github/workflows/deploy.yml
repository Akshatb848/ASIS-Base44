name: Build & Deploy to GCP VM # v5

on:
  push:
    branches:
      - claude/replicate-asis-v5-h5mWO
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build image & deploy via SCP
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the Docker image on the runner (reliable internet here)
      - name: Build Docker image
        run: docker build -t asis-v5:latest .

      # Export image to a gzipped tar (~25 MB)
      - name: Export image as tar
        run: docker save asis-v5:latest | gzip > /tmp/asis-v5.tar.gz

      # Setup SSH key (base64-decoded — no newline issues)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      # Copy image tar to VM over SSH (no Docker Hub needed on VM)
      - name: SCP image to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          scp -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            /tmp/asis-v5.tar.gz \
            "${VM_USER}@${VM_HOST}:/tmp/asis-v5.tar.gz"

      # Load image and restart container on VM
      - name: Load image and restart container
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          ssh -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${VM_USER}@${VM_HOST}" << 'ENDSSH'
          set -e

          echo "=== Loading image ==="
          docker load < /tmp/asis-v5.tar.gz
          rm -f /tmp/asis-v5.tar.gz

          echo "=== Restarting container ==="
          docker stop asis-v5 2>/dev/null || true
          docker rm   asis-v5 2>/dev/null || true
          docker run -d \
            --name asis-v5 \
            --restart unless-stopped \
            -p 80:80 \
            asis-v5:latest

          echo "=== Pruning old images ==="
          docker image prune -f

          echo "=== Deploy complete ==="
          docker ps --filter name=asis-v5 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH
