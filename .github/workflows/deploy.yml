name: Build & Deploy to GCP VM # v6

on:
  push:
    branches:
      - claude/replicate-asis-v5-h5mWO
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

      # Archive the built dist/ folder
      - name: Package dist
        run: tar -czf dist.tar.gz dist/

      # Setup SSH key (base64-decoded)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      # Copy built files to VM
      - name: SCP dist to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          scp -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            dist.tar.gz \
            "${VM_USER}@${VM_HOST}:/tmp/asis-dist.tar.gz"

      # Install nginx (if needed) and deploy static files
      - name: Deploy on VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
        run: |
          ssh -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${VM_USER}@${VM_HOST}" << 'ENDSSH'
          set -e

          echo "=== Installing nginx ==="
          # Wait for any apt lock to clear
          for i in 1 2 3 4 5; do
            sudo apt-get install -y nginx && break || sleep 10
          done

          echo "=== Deploying static files ==="
          sudo mkdir -p /var/www/asis-v5
          sudo tar -xzf /tmp/asis-dist.tar.gz -C /tmp/
          sudo rsync -a --delete /tmp/dist/ /var/www/asis-v5/
          rm -f /tmp/asis-dist.tar.gz

          echo "=== Writing nginx config ==="
          sudo tee /etc/nginx/sites-available/asis-v5 > /dev/null << 'NGINX'
          server {
              listen 80 default_server;
              root /var/www/asis-v5;
              index index.html;
              gzip on;
              gzip_types text/plain text/css application/json application/javascript text/javascript;
              location / {
                  try_files $uri $uri/ /index.html;
              }
              location ~* \.(js|css|png|ico|svg|woff2?)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
          NGINX

          sudo ln -sf /etc/nginx/sites-available/asis-v5 /etc/nginx/sites-enabled/asis-v5
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl reload nginx

          echo "=== Deploy complete ==="
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" http://localhost
          ENDSSH
