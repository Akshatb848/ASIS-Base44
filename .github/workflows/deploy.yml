name: Build & Deploy to GCP VM # v4

on:
  push:
    branches:
      - claude/replicate-asis-v5-h5mWO
      - main
  workflow_dispatch:

jobs:
  # ── Validate build on the runner (fast feedback, no push needed) ───────────
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & build
        run: |
          npm ci
          npm run build

  # ── SSH into VM → git pull → docker build locally → restart container ──────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VM (git pull + local docker build)
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_HOST: ${{ secrets.GCP_VM_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/gcp_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${VM_USER}@${VM_HOST}" \
            "BRANCH='${BRANCH}' bash -s" << 'ENDSSH'
          set -e
          APP_DIR="/opt/asis-v5"

          echo "=== Updating code ==="
          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull origin "$BRANCH"

          echo "=== Building Docker image locally ==="
          docker build -t asis-v5:latest .

          echo "=== Restarting container ==="
          docker stop asis-v5 2>/dev/null || true
          docker rm   asis-v5 2>/dev/null || true
          docker run -d \
            --name asis-v5 \
            --restart unless-stopped \
            -p 80:80 \
            asis-v5:latest

          echo "=== Cleaning up dangling images ==="
          docker image prune -f

          echo "=== Deploy complete ==="
          docker ps --filter name=asis-v5 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH
