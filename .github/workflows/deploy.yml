name: Build & Deploy to GCP VM # v3

on:
  push:
    branches:
      - claude/replicate-asis-v5-h5mWO
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/asis-v5

jobs:
  # ── 1. Build Docker image and push to GitHub Container Registry ───────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/claude/replicate-asis-v5-h5mWO' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. SSH into GCP VM and redeploy (native SSH — avoids key-parse bugs) ──
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Write key and fix any missing newlines (common secret copy-paste issue)
          printf '%s' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/gcp_deploy_key
          # Ensure the key ends with a newline
          echo "" >> ~/.ssh/gcp_deploy_key
          chmod 600 ~/.ssh/gcp_deploy_key
          # Add host to known_hosts to skip interactive prompt
          ssh-keyscan -H "${{ secrets.GCP_VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/gcp_deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}" \
            "IMAGE='${IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" << 'ENDSSH'

          set -e
          echo "=== Logging in to GHCR ==="
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          echo "=== Pulling latest image ==="
          docker pull "$IMAGE"

          echo "=== Stopping old container ==="
          docker stop asis-v5 2>/dev/null || true
          docker rm   asis-v5 2>/dev/null || true

          echo "=== Starting new container ==="
          docker run -d \
            --name asis-v5 \
            --restart unless-stopped \
            -p 80:80 \
            "$IMAGE"

          echo "=== Cleaning up old images ==="
          docker image prune -f

          echo "=== Deploy complete ==="
          docker ps --filter name=asis-v5 --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH
